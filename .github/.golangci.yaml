version: "2"
linters:

  default: standard
  # enable:
  #   - xyz

  settings:
    staticcheck:
      # https://staticcheck.dev/docs/configuration/options/#checks
      checks: [
        # Default excludes
        "all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022",
        # Dot imports
        "-ST1001",
        # Error strings
        "-ST1005"
      ]
